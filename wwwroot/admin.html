<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administrador</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            min-height: 100vh;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            background: #4facfe;
            color: white;
            margin: 2px;
        }

            button:hover {
                background: #2d7dfc;
            }

            button.danger {
                background: #e74c3c;
            }

                button.danger:hover {
                    background: #c0392b;
                }

            button.secondary {
                background: #6c757d;
            }

                button.secondary:hover {
                    background: #555d66;
                }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #4facfe;
            color: white;
        }

        .msg {
            margin-top: 15px;
            font-weight: bold;
        }

            .msg.ok {
                color: green;
            }

            .msg.error {
                color: #c0392b;
            }
    </style>
</head>
<body>

    <div class="container">
        <div class="topbar">
            <div class="info" id="infoAdmin">Panel de administración</div>
            <div>
                <button onclick="abrirDashboard()">Dashboard</button>
                <button onclick="exportarExcel()">Exportar Excel</button>
                <button class="secondary" onclick="cargarUsuarios()">Actualizar</button>
                <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>

        <h1>Administración de Usuarios</h1>

        <div class="card">
            <h2>Crear usuario</h2>

            <div class="grid">
                <input type="text" id="usuario" placeholder="Usuario">
                <input type="text" id="password" placeholder="Contraseña / DUI">

                <select id="rol" onchange="ajustarCampos()">
                    <option value="">Seleccione rol</option>
                    <option value="admin">Administrador</option>
                    <option value="departamental">Departamental</option>
                    <option value="distrital">Distrital</option>
                </select>

                <input type="text" id="departamento" placeholder="Departamento">
                <input type="text" id="distrito" placeholder="Distrito">
            </div>

            <div style="margin-top:15px;">
                <button onclick="crearUsuario()">Guardar usuario</button>
            </div>

            <div id="mensaje" class="msg"></div>
        </div>

        <div class="card">
            <h2>Usuarios registrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Departamento</th>
                        <th>Distrito</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "/api";

        document.addEventListener("DOMContentLoaded", () => {
            validarAdmin();
            cargarUsuarios();
            ajustarCampos();
        });

        function validarAdmin() {
            const sesion = JSON.parse(localStorage.getItem("usuario"));

            if (!sesion) {
                alert("Debes iniciar sesión");
                window.location.href = "index.html";
                return;
            }

            if ((sesion.rol || "").toLowerCase() !== "admin") {
                alert("Acceso denegado");
                window.location.href = "index.html";
                return;
            }

            document.getElementById("infoAdmin").textContent = "Administrador: " + sesion.usuario;
        }

        function ajustarCampos() {
            const rol = document.getElementById("rol").value;
            const departamento = document.getElementById("departamento");
            const distrito = document.getElementById("distrito");

            if (rol === "admin") {
                departamento.value = "";
                distrito.value = "";
                departamento.disabled = true;
                distrito.disabled = true;
            } else if (rol === "departamental") {
                distrito.value = "";
                departamento.disabled = false;
                distrito.disabled = true;
            } else if (rol === "distrital") {
                departamento.disabled = false;
                distrito.disabled = false;
            } else {
                departamento.disabled = false;
                distrito.disabled = false;
            }
        }

        async function crearUsuario() {
            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();
            const rol = document.getElementById("rol").value;
            const departamento = document.getElementById("departamento").value.trim();
            const distrito = document.getElementById("distrito").value.trim();
            const mensaje = document.getElementById("mensaje");

            mensaje.textContent = "";
            mensaje.className = "msg";

            if (!usuario || !password || !rol) {
                mensaje.textContent = "Completa usuario, contraseña y rol.";
                mensaje.classList.add("error");
                return;
            }

            if (rol === "departamental" && !departamento) {
                mensaje.textContent = "Debes escribir el departamento.";
                mensaje.classList.add("error");
                return;
            }

            if (rol === "distrital" && (!departamento || !distrito)) {
                mensaje.textContent = "Debes escribir departamento y distrito.";
                mensaje.classList.add("error");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Usuarios/crear`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario, password, rol, departamento, distrito })
                });

                const data = await response.json();

                if (response.ok) {
                    mensaje.textContent = data.mensaje || "Usuario creado correctamente.";
                    mensaje.classList.add("ok");
                    limpiarFormulario();
                    cargarUsuarios();
                } else {
                    mensaje.textContent = data.mensaje || "No se pudo crear el usuario.";
                    mensaje.classList.add("error");
                }
            } catch (error) {
                console.error(error);
                mensaje.textContent = "Error al conectar con la API.";
                mensaje.classList.add("error");
            }
        }

        async function cargarUsuarios() {
            const tabla = document.getElementById("tablaUsuarios");
            tabla.innerHTML = "<tr><td colspan='6'>Cargando...</td></tr>";

            try {
                const response = await fetch(`${API_URL}/Usuarios/listar`);

                if (!response.ok) {
                    tabla.innerHTML = "<tr><td colspan='6'>Error al cargar usuarios</td></tr>";
                    return;
                }

                const usuarios = await response.json();

                if (!usuarios.length) {
                    tabla.innerHTML = "<tr><td colspan='6'>No hay usuarios registrados</td></tr>";
                    return;
                }

                tabla.innerHTML = "";

                usuarios.forEach(u => {
                    tabla.innerHTML += `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.usuario}</td>
                    <td>${u.rol}</td>
                    <td>${u.departamento || ""}</td>
                    <td>${u.distrito || ""}</td>
                    <td>
                        <button onclick="cambiarPassword(${u.id}, '${u.usuario}')">Cambiar contraseña</button>
                        ${(u.rol || "").toLowerCase() !== "admin"
                            ? `<button class="danger" onclick="eliminarUsuario(${u.id}, '${u.usuario}')">Eliminar</button>`
                            : `Protegido`}
                    </td>
                </tr>
            `;
                });

            } catch (error) {
                console.error(error);
                tabla.innerHTML = "<tr><td colspan='6'>Error al conectar con la API</td></tr>";
            }
        }

        async function eliminarUsuario(id, usuario) {
            if (!confirm(`¿Seguro que deseas eliminar al usuario ${usuario}?`)) {
                return;
            }

            if ((usuario || "").toLowerCase() === "admin") {
                alert("No puedes eliminar el usuario administrador");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Usuarios/eliminar/${id}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensaje || "Usuario eliminado");
                    cargarUsuarios();
                } else {
                    alert(data.mensaje || "No se pudo eliminar");
                }
            } catch (error) {
                console.error(error);
                alert("Error al conectar con la API");
            }
        }

        async function cambiarPassword(id, usuario) {
            const nueva = prompt("Nueva contraseña para " + usuario + ":");

            if (!nueva || nueva.trim() === "") {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Usuarios/cambiar-password/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: nueva.trim()
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensaje || "Contraseña actualizada");
                } else {
                    alert(data.mensaje || "No se pudo cambiar la contraseña");
                }
            } catch (error) {
                console.error(error);
                alert("Error al conectar con la API");
            }
        }

        function limpiarFormulario() {
            document.getElementById("usuario").value = "";
            document.getElementById("password").value = "";
            document.getElementById("rol").value = "";
            document.getElementById("departamento").value = "";
            document.getElementById("distrito").value = "";
            ajustarCampos();
        }

        function cerrarSesion() {
            localStorage.removeItem("usuario");
            window.location.href = "index.html";
        }

        function exportarExcel() {
            window.open("/api/Registros/exportar-excel", "_blank");
        }

        function abrirDashboard() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
