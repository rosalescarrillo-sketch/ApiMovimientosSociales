<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administrador</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            min-height: 100vh;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 12px;
        }

        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .dept-card {
            background: #f7f9fc;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

            .dept-card:hover {
                transform: translateY(-3px);
                border-color: #4facfe;
                box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            }

            .dept-card.active {
                border-color: #2d7dfc;
                background: #e9f3ff;
            }

            .dept-card h3 {
                margin: 0;
                color: #333;
            }

            .dept-card p {
                margin: 8px 0 0;
                font-weight: bold;
                color: #4facfe;
            }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            background: #4facfe;
            color: white;
            margin: 2px;
        }

            button:hover {
                background: #2d7dfc;
            }

            button.danger {
                background: #e74c3c;
            }

                button.danger:hover {
                    background: #c0392b;
                }

            button.secondary {
                background: #6c757d;
            }

                button.secondary:hover {
                    background: #555d66;
                }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #4facfe;
            color: white;
        }

        .msg {
            margin-top: 15px;
            font-weight: bold;
        }

            .msg.ok {
                color: green;
            }

            .msg.error {
                color: #c0392b;
            }

        .titulo-seccion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .contador {
            font-weight: bold;
            color: #2d7dfc;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="topbar">
            <div class="info" id="infoAdmin">Panel de administración</div>
            <div>
                <button onclick="abrirDashboard()">Dashboard</button>
                <button onclick="exportarExcel()">Exportar Excel</button>
                <button class="secondary" onclick="verTodos()">Ver todos</button>
                <button class="secondary" onclick="cargarUsuarios()">Actualizar</button>
                <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>

        <h1>Administración de Usuarios</h1>

        <div class="card">
            <div class="titulo-seccion">
                <h2>Resumen por departamento</h2>
                <span class="contador" id="totalUsuarios">Total usuarios: 0</span>
            </div>

            <p>Haz clic en un departamento para ver únicamente los usuarios asignados.</p>

            <div class="dept-grid" id="contenedorDepartamentos"></div>
        </div>

        <div class="card">
            <h2>Crear usuario</h2>

            <div class="grid">
                <input type="text" id="usuario" placeholder="Usuario">
                <input type="text" id="password" placeholder="Contraseña / DUI">

                <select id="rol" onchange="ajustarCampos()">
                    <option value="">Seleccione rol</option>
                    <option value="admin">Administrador</option>
                    <option value="departamental">Departamental</option>
                    <option value="distrital">Distrital</option>
                </select>

                <select id="departamento">
                    <option value="">Seleccione departamento</option>
                    <option value="Ahuachapán">Ahuachapán</option>
                    <option value="Cabañas">Cabañas</option>
                    <option value="Chalatenango">Chalatenango</option>
                    <option value="Cuscatlán">Cuscatlán</option>
                    <option value="La Libertad">La Libertad</option>
                    <option value="La Paz">La Paz</option>
                    <option value="La Unión">La Unión</option>
                    <option value="Morazán">Morazán</option>
                    <option value="San Miguel">San Miguel</option>
                    <option value="San Salvador">San Salvador</option>
                    <option value="San Vicente">San Vicente</option>
                    <option value="Santa Ana">Santa Ana</option>
                    <option value="Sonsonate">Sonsonate</option>
                    <option value="Usulutan">Usulutan</option>
                </select>

                <input type="text" id="distrito" placeholder="Distrito">
            </div>

            <div style="margin-top:15px;">
                <button onclick="crearUsuario()">Guardar usuario</button>
            </div>

            <div id="mensaje" class="msg"></div>
        </div>

        <div class="card">
            <div class="titulo-seccion">
                <h2 id="tituloTabla">Usuarios registrados</h2>
                <span class="contador" id="contadorTabla">Mostrando: 0</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Departamento</th>
                        <th>Distrito</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>

    </div>

    <script>
        const API_URL = "/api";

        const departamentos = [
            "Ahuachapán",
            "Cabañas",
            "Chalatenango",
            "Cuscatlán",
            "La Libertad",
            "La Paz",
            "La Unión",
            "Morazán",
            "San Miguel",
            "San Salvador",
            "San Vicente",
            "Santa Ana",
            "Sonsonate",
            "Usulutan"
        ];

        let usuariosGlobal = [];
        let departamentoSeleccionado = "";

        document.addEventListener("DOMContentLoaded", () => {
            validarAdmin();
            cargarUsuarios();
            ajustarCampos();
        });

        function validarAdmin() {
            const sesion = JSON.parse(localStorage.getItem("usuario"));

            if (!sesion) {
                alert("Debes iniciar sesión");
                window.location.href = "index.html";
                return;
            }

            if ((sesion.rol || "").toLowerCase() !== "admin") {
                alert("Acceso denegado");
                window.location.href = "index.html";
                return;
            }

            document.getElementById("infoAdmin").textContent = "Administrador: " + sesion.usuario;
        }

        function ajustarCampos() {
            const rol = document.getElementById("rol").value;
            const departamento = document.getElementById("departamento");
            const distrito = document.getElementById("distrito");

            if (rol === "admin") {
                departamento.value = "";
                distrito.value = "";
                departamento.disabled = true;
                distrito.disabled = true;
            } else if (rol === "departamental") {
                distrito.value = "";
                departamento.disabled = false;
                distrito.disabled = true;
            } else if (rol === "distrital") {
                departamento.disabled = false;
                distrito.disabled = false;
            } else {
                departamento.disabled = false;
                distrito.disabled = false;
            }
        }

        async function cargarUsuarios() {
            const tabla = document.getElementById("tablaUsuarios");
            tabla.innerHTML = "<tr><td colspan='6'>Cargando...</td></tr>";

            try {
                const response = await fetch(`${API_URL}/Usuarios/listar`);

                if (!response.ok) {
                    tabla.innerHTML = "<tr><td colspan='6'>Error al cargar usuarios</td></tr>";
                    return;
                }

                usuariosGlobal = await response.json();

                renderDepartamentos();
                aplicarFiltroActual();

            } catch (error) {
                console.error(error);
                tabla.innerHTML = "<tr><td colspan='6'>Error al conectar con la API</td></tr>";
            }
        }

        function renderDepartamentos() {
            const contenedor = document.getElementById("contenedorDepartamentos");
            contenedor.innerHTML = "";

            document.getElementById("totalUsuarios").textContent =
                "Total usuarios: " + usuariosGlobal.length;

            departamentos.forEach(dep => {
                const cantidad = usuariosGlobal.filter(u =>
                    normalizar(u.departamento) === normalizar(dep)
                ).length;

                const div = document.createElement("div");
                div.className = "dept-card";

                if (normalizar(departamentoSeleccionado) === normalizar(dep)) {
                    div.classList.add("active");
                }

                div.onclick = () => filtrarDepartamento(dep);

                div.innerHTML = `
                    <h3>${dep}</h3>
                    <p>${cantidad} usuario(s)</p>
                `;

                contenedor.appendChild(div);
            });
        }

        function filtrarDepartamento(dep) {
            departamentoSeleccionado = dep;
            renderDepartamentos();
            aplicarFiltroActual();
        }

        function verTodos() {
            departamentoSeleccionado = "";
            renderDepartamentos();
            aplicarFiltroActual();
        }

        function aplicarFiltroActual() {
            let lista = usuariosGlobal;

            if (departamentoSeleccionado) {
                lista = usuariosGlobal.filter(u =>
                    normalizar(u.departamento) === normalizar(departamentoSeleccionado)
                );

                document.getElementById("tituloTabla").textContent =
                    "Usuarios de " + departamentoSeleccionado;
            } else {
                document.getElementById("tituloTabla").textContent =
                    "Usuarios registrados";
            }

            renderTablaUsuarios(lista);
        }

        function renderTablaUsuarios(usuarios) {
            const tabla = document.getElementById("tablaUsuarios");
            document.getElementById("contadorTabla").textContent =
                "Mostrando: " + usuarios.length;

            if (!usuarios.length) {
                tabla.innerHTML = "<tr><td colspan='6'>No hay usuarios para mostrar</td></tr>";
                return;
            }

            tabla.innerHTML = "";

            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.usuario}</td>
                        <td>${u.rol}</td>
                        <td>${u.departamento || ""}</td>
                        <td>${u.distrito || ""}</td>
                        <td>
                            <button onclick="cambiarPassword(${u.id}, '${escapeHtml(u.usuario)}')">Cambiar contraseña</button>
                            ${(u.rol || "").toLowerCase() !== "admin"
                        ? `<button class="danger" onclick="eliminarUsuario(${u.id}, '${escapeHtml(u.usuario)}')">Eliminar</button>`
                        : `Protegido`}
                        </td>
                    </tr>
                `;
            });
        }

        async function crearUsuario() {
            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();
            const rol = document.getElementById("rol").value;
            const departamento = document.getElementById("departamento").value.trim();
            const distrito = document.getElementById("distrito").value.trim();
            const mensaje = document.getElementById("mensaje");

            mensaje.textContent = "";
            mensaje.className = "msg";

            if (!usuario || !password || !rol) {
                mensaje.textContent = "Completa usuario, contraseña y rol.";
                mensaje.classList.add("error");
                return;
            }

            if (rol === "departamental" && !departamento) {
                mensaje.textContent = "Debes seleccionar el departamento.";
                mensaje.classList.add("error");
                return;
            }

            if (rol === "distrital" && (!departamento || !distrito)) {
                mensaje.textContent = "Debes seleccionar departamento y escribir distrito.";
                mensaje.classList.add("error");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Usuarios/crear`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario, password, rol, departamento, distrito })
                });

                const data = await response.json();

                if (response.ok) {
                    mensaje.textContent = data.mensaje || "Usuario creado correctamente.";
                    mensaje.classList.add("ok");
                    limpiarFormulario();
                    await cargarUsuarios();
                } else {
                    mensaje.textContent = data.mensaje || "No se pudo crear el usuario.";
                    mensaje.classList.add("error");
                }
            } catch (error) {
                console.error(error);
                mensaje.textContent = "Error al conectar con la API.";
                mensaje.classList.add("error");
            }
        }

        async function eliminarUsuario(id, usuario) {
            if (!confirm(`¿Seguro que deseas eliminar al usuario ${usuario}?`)) {
                return;
            }

            if ((usuario || "").toLowerCase() === "admin") {
                alert("No puedes eliminar el usuario administrador");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Usuarios/eliminar/${id}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensaje || "Usuario eliminado");
                    await cargarUsuarios();
                } else {
                    alert(data.mensaje || "No se pudo eliminar");
                }
            } catch (error) {
                console.error(error);
                alert("Error al conectar con la API");
            }
        }

        async function cambiarPassword(id, usuario) {
            const nueva = prompt("Nueva contraseña para " + usuario + ":");

            if (!nueva || nueva.trim() === "") {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Usuarios/cambiar-password/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: nueva.trim()
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensaje || "Contraseña actualizada");
                } else {
                    alert(data.mensaje || "No se pudo cambiar la contraseña");
                }
            } catch (error) {
                console.error(error);
                alert("Error al conectar con la API");
            }
        }

        function limpiarFormulario() {
            document.getElementById("usuario").value = "";
            document.getElementById("password").value = "";
            document.getElementById("rol").value = "";
            document.getElementById("departamento").value = "";
            document.getElementById("distrito").value = "";
            ajustarCampos();
        }

        function cerrarSesion() {
            localStorage.removeItem("usuario");
            window.location.href = "index.html";
        }

        function exportarExcel() {
            window.open("/api/Registros/exportar-excel", "_blank");
        }

        function abrirDashboard() {
            window.location.href = "dashboard.html";
        }

        function normalizar(texto) {
            return (texto || "")
                .toString()
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        function escapeHtml(texto) {
            return (texto || "")
                .toString()
                .replace(/'/g, "\\'")
                .replace(/"/g, "&quot;");
        }
    </script>

</body>
</html>
