<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard General</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial,sans-serif;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            min-height: 100vh;
            padding: 30px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 15px;
        }

        .box {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

            .box h2 {
                margin: 0;
                font-size: 32px;
                color: #4facfe;
            }

            .box p {
                margin-top: 10px;
                font-weight: bold;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #4facfe;
            color: white;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            background: #4facfe;
            color: white;
        }

            button:hover {
                background: #2d7dfc;
            }

            button.secondary {
                background: #6c757d;
            }

                button.secondary:hover {
                    background: #555d66;
                }

        .dos-columnas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media(max-width:900px) {
            .dos-columnas {
                grid-template-columns: 1fr;
            }
        }

        canvas {
            max-height: 420px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="topbar">
            <div class="info" id="infoUsuario">Dashboard</div>
            <div>
                <button class="secondary" onclick="volver()">Volver</button>
                <button onclick="cargarDashboard()">Actualizar</button>
            </div>
        </div>

        <h1>Dashboard General</h1>

        <div class="card">
            <div class="grid">
                <div class="box">
                    <h2 id="totalRegistros">0</h2>
                    <p>Total Registros</p>
                </div>
                <div class="box">
                    <h2 id="totalDepartamentos">0</h2>
                    <p>Departamentos</p>
                </div>
                <div class="box">
                    <h2 id="totalDistritos">0</h2>
                    <p>Distritos</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Registros por Departamento</h2>
            <canvas id="graficaDepartamentos"></canvas>
        </div>

        <div class="dos-columnas">
            <div class="card">
                <h2>Top 10 Distritos con más registros</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Distrito</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTopDistritos"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>Top 3 Distritos con menos registros</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Distrito</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDistritosBajos"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "/api";
        let grafica = null;

        document.addEventListener("DOMContentLoaded", () => {
            const sesion = JSON.parse(localStorage.getItem("usuario"));

            if (!sesion) {
                alert("Debes iniciar sesión");
                window.location.href = "index.html";
                return;
            }

            document.getElementById("infoUsuario").textContent = "Usuario: " + sesion.usuario;
            cargarDashboard();
        });

        async function cargarDashboard() {
            try {
                const response = await fetch(`${API_URL}/Registros/dashboard`);
                const data = await response.json();

                document.getElementById("totalRegistros").textContent = data.totalRegistros || 0;
                document.getElementById("totalDepartamentos").textContent = data.totalDepartamentos || 0;
                document.getElementById("totalDistritos").textContent = data.totalDistritos || 0;

                llenarTablaTopDistritos(data.topDistritos || []);
                llenarTablaDistritosBajos(data.distritosBajos || []);
                crearGraficaDepartamentos(data.porDepartamento || []);
            } catch (error) {
                console.error(error);
                alert("Error al cargar dashboard");
            }
        }

        function llenarTablaTopDistritos(lista) {
            const tabla = document.getElementById("tablaTopDistritos");
            tabla.innerHTML = "";

            if (!lista.length) {
                tabla.innerHTML = "<tr><td colspan='2'>Sin datos</td></tr>";
                return;
            }

            lista.forEach(item => {
                tabla.innerHTML += `
                <tr>
                    <td>${item.distrito}</td>
                    <td>${item.total}</td>
                </tr>
            `;
            });
        }

        function llenarTablaDistritosBajos(lista) {
            const tabla = document.getElementById("tablaDistritosBajos");
            tabla.innerHTML = "";

            if (!lista.length) {
                tabla.innerHTML = "<tr><td colspan='2'>Sin datos</td></tr>";
                return;
            }

            lista.forEach(item => {
                tabla.innerHTML += `
                <tr>
                    <td>${item.distrito}</td>
                    <td>${item.total}</td>
                </tr>
            `;
            });
        }

        function crearGraficaDepartamentos(lista) {
            const etiquetas = lista.map(x => x.departamento);
            const valores = lista.map(x => x.total);

            const ctx = document.getElementById("graficaDepartamentos").getContext("2d");

            if (grafica) {
                grafica.destroy();
            }

            grafica = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: "Cantidad de registros",
                        data: valores,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }

        function volver() {
            window.location.href = "admin.html";
        }
    </script>
</body>
</html>
